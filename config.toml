# --- Marine nature lane: PRINT feeds ------------------------------------------
# kind = "nature" does three things: it routes these into a SEPARATE selection
# call with its own budget (nature_max_items above), it gives them the long
# 168h lookback, and it exempts them from one-shot seen-marking. Same reasoning
# as "research": this lane gets three slots, so a Defra announcement that loses
# out on a busy day deserves another look rather than being binned for good.
#
# Six feeds, all checked on 2026-11-21 for recency, volume AND whether the
# body text is actually extractable — a feed whose articles won't scrape can
# only ever be a headline, and this briefing quotes.
#
# Rejected after testing, so don't re-add without re-checking:
#  - gov.uk all.atom for Defra / Natural England / MMO: high volume, but it is
#    almost entirely licences and disease notices ("Hazel dormice: survey or
#    research - level 2 licence", "Bird flu: latest situation"). That is the
#    regulatory minutiae this lane is explicitly meant to skip. The
#    news-and-communications.atom variant carries the announcements instead.
#  - Natural England news (gov.uk): 2 items in 30 days and both were visitor-
#    centre PR. Their BLOG is the one with the policy content.
#  - JNCC: newest item 220 days old. Dormant.
#  - Cefas: 3 items in 30 days, all fish-disease control orders. Too technical.
#  - Environment Agency news: 15 items a week, mostly local permits and
#    prosecutions. Volume without altitude.
#  - Defra farming blog: active, but terrestrial scheme mechanics.
#  - Oceana UK: newest item 43 days old.
#  - BusinessGreen: the best-fitting trade feed on paper and 40 items a week,
#    but the feed carries no body and the articles return HTTP errors to a
#    scraper. Headlines only, at high volume. Revisit if a quotable path opens.

# Defra announcements. ~7 items a week at the right altitude.
[[print_feeds]]
name = "Defra"
url = "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=department-for-environment-food-rural-affairs"
kind = "nature"

# The marine regulator. Low volume, high relevance: corporate strategy,
# licensing policy statements, MPA enforcement.
[[print_feeds]]
name = "Marine Management Organisation"
url = "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=marine-management-organisation"
