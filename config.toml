# All tunables live here. Secrets and email addresses do NOT — those come from
# environment variables (.env locally, GitHub Secrets in CI), because this repo
# will be public.

[whisper]
model = "medium"   # production accuracy target; override with "base"/"small" for fast local tests
# Domain glossary seeded into Whisper's initial_prompt - cuts mis-hearings in the
# RAW transcript so verbatim quotes stay faithful (spec §9).
#
# HARD LIMIT: 223 TOKENS. Whisper's decoder context is 448 tokens and
# faster-whisper keeps only the last `448 // 2 - 1` of the prompt
# (tokenizer.get_prompt), silently discarding the FRONT of anything longer. On
# 2026-11-21 this glossary had grown to 360 tokens, which meant DESNZ, NESO,
# SSEP, Ofgem, CfD, AR7/AR8 and every minister's name were being thrown away
# while the tail survived. transcribe.py now counts the tokens and says so
# loudly, and tests/test_briefing.py guards the budget offline. Caught before
# any run used it, but check the log line before adding terms.
#
# Because the budget is tight, this list holds ONLY what Whisper gets WRONG:
# acronyms, awkward proper nouns and programme names. Ordinary English -
# "offshore wind", "natural capital", "net zero", "marine protected area" -
# is deliberately absent. Whisper medium transcribes it correctly unaided, and
# every token spent on it pushes something that matters off the front.
#
# Note also that faster-whisper defaults to condition_on_previous_text=True, so
# the glossary primes the opening of a file and then decays as the transcript
# accumulates. It is a priming device, not a dictionary that applies throughout.
# Names matter as much as acronyms: a mis-heard minister corrupts the quote AND
# the archive. Refresh after any reshuffle (2026-07: Burnham cabinet).
glossary = "DESNZ, NESO, SSEP, Ofgem, CfD, AR7, AR8, REMA, TNUoS, NSTA, the Crown Estate, Celtic Sea, Rosebank, Jackdaw, Miatta Fahnbulleh, Makerfield, Polanski, Caroline Price, Gus Jaspert, Defra, JNCC, Cefas, MMO, MPA, ReMeMaRe, MaRePo, POSEIDON, ECOFLOW, Marine Delivery Routemap, saltmarsh, seagrass, benthic, denitrification, Senedd, Plaid Cymru, Cymru, Rhun ap Iorwerth, Ken Skates, Drakeford, Wigley, Erebus, Mona, IFS, OBR, Milburn"

[gemini]
# Strongest free-tier model, as config because Google rotates/retires these (spec §7).
# (2026-07: Pro models are paid-only — free tier is the Flash family. Verified
# empirically: 2.5-pro returns 429 "limit: 0" on a free key.)
model = "gemini-3.6-flash"
# Free-tier quota is 20 requests PER DAY PER MODEL, so this ladder is a quota
# pool as much as a fallback: five rungs = ~100 calls a day. A 16-episode
# morning needs ~20 on its own, which is how 2026-09-13 ran dry.
#
# Ordered by capability, not novelty: the full Flash models first, then Lite,
# so a quota-exhausted morning degrades in quality as late as possible.
#
# 2026-10-11: ALL FIVE probed directly against the project's own free key and
# confirmed usable — listing a model via models.list() does NOT mean the free
# tier can call it (2.5-pro is listed and returns 429 "limit: 0"). Re-probe the
# same way before trusting any change here.
#
# Why these five:
#   - gemini-3.5-flash was DEPRECATED 2026-10-08 and silently redirects to
#     3.6-flash. Naming 3.6 directly changes nothing today and removes the
#     dependency on a redirect Google will eventually withdraw.
#   - gemini-2.5-flash is on borrowed time: retired 2026-10-20 on Vertex and
#     already 404 for new projects on this API. It still answers on THIS key
#     because the project used it before the cutoff. Kept as the last rung for
#     the free quota while it lasts — delete it when it starts returning 404.
#   - gemini-3.5-flash-lite is not deprecated (retires 2027-07-21 at the
#     earliest), so it is the stable rung.
fallback_models = [
  "gemini-3.7-flash",
  "gemini-3.8-flash",
  "gemini-3.5-flash-lite",
  "gemini-2.5-flash",
]

[email]
smtp_host = "smtp.gmail.com"
smtp_port = 587
# from/to addresses + app password come from env: BRIEFING_FROM, BRIEFING_TO, GMAIL_APP_PASSWORD

[storage]
data_dir = "data"   # scratch for downloaded audio (gitignored). Transcripts + state
                    # live in ARCHIVE_DIR (the private repo in CI; data/ locally).
archive_repo_url = "https://github.com/domatt10/podcast-briefing-archive"

[filtering]
min_duration_secs = 300        # skip trailers/clips (spec App. B junk filtering)
flag_feed_after_failures = 3   # consecutive failed runs before the footer flags a feed

[behaviour]
quiet_day_email = true   # send a one-liner on days with nothing new
                         # (one-email-per-day is enforced in code regardless:
                         # a late-fired second run holds its episodes for tomorrow)

# --- News layer (agent brief A.1): reported fact beside the speculation ------
# Saved as text files to /news/ in the private archive. No LLM involved.

[news]
# Non-politics feeds only keep stories matching these (title + summary):
energy_keywords = [
    "offshore wind", "wind farm", "wind power", "energy", "electricity",
    "grid", "net zero", "nuclear", "solar", "renewable", "DESNZ", "Ofgem",
    "oil and gas", "North Sea", "carbon", "Miliband", "power station",
    "hydrogen", "Great British Energy",
]
max_per_feed = 25   # per run — curation, not the firehose

# --- "In print" (under-the-radar online news in the briefing email) ----------
# Open-text sources only (extended quotes need full article bodies). BBC and
# Politico stay archive-only by design — Dom reads those already.

[in_print]
max_items = 6
lookback_hours = 30    # a run sees everything published since ~yesterday's run
max_per_source = 2     # stops the prolific party-political sites crowding out energy
# Research feeds get a longer window. A think tank report is still worth
# flagging three days on; a comment piece is not. Pairs with the seen-marking
# rule in in_print.hashes_to_mark — unselected research keeps its place in the
# pool for this long instead of being discarded after one look.
research_lookback_hours = 168
# The nature pass has its OWN budget and runs as a separate selection call.
# Sharing the six general slots would mean nature never places on a busy
# political day, and crowds out politics on a quiet one.
nature_lookback_hours = 168
nature_max_items = 3
nature_max_per_source = 2

