# --- Wales -------------------------------------------------------------------
# Added 2026-11-21. Wales was the one blind spot in the list: the Crown Estate's
# remit covers Welsh seabed and the Celtic Sea, there is now a Plaid Cymru
# Welsh Government campaigning to have that revenue devolved, and nothing in
# the feed list could see any of it. Burnham's refusal to devolve the Crown
# Estate in Wales (20 Nov 2026) was invisible to the briefing - the BBC
# Politics news feed carried it, but news feeds only write to the archive.
# See also the Wales lines in profile.md and baseline.md: the feed alone is not
# enough. Tested without them and the selector passed over the devolution story
# twice while using 2 of 6 slots, because nothing told it Wales was in scope.

# Weekly, ~45 min. Welsh political insiders - Senedd arithmetic, Budget
# negotiations, Welsh Labour's rebuild under Ken Skates, Reform in the Senedd.
[[feeds]]
name = "Senedd Sources"
url = "https://feeds.acast.com/public/shows/68da26c6099369ce420066ac"
category = "politics"

